# Keycloak Operator - Local Development Cluster
# Minimal resource allocation for local testing

operator:
  # Increased resources for Quarkus-based operator
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  
  # Increase startup probe timeout for slower local environments
  startupProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 30  # Allow up to 5 minutes for startup

# Keycloak instance disabled - deploy operator only
keycloak:
  enabled: false
