# ArgoCD metadata for Keycloak Operator
# This file is discovered by the ApplicationSet to deploy Keycloak across clusters
# Using adfinis/keycloak-operator Helm chart (wraps official Keycloak operator)
# Chart: https://artifacthub.io/packages/helm/adfinis/keycloak-operator

chartName: keycloak-operator
chartRepoURL: https://charts.adfinis.com
targetNamespace: keycloak-system

# Version control per cluster
clusters:
  # Local Development
  local-dev:
    enabled: true
    chartVersion: "1.9.0"
  
  # IKV Clusters
  aks-ikv-nonprod-vnext:
    enabled: true
    chartVersion: "1.9.0"
  aks-ikv-nonprod:
    enabled: true
    chartVersion: "1.9.0"
  aks-ikv-prod:
    enabled: true
    chartVersion: "1.9.0"
  
  # Commonground Clusters
  aks-commonground-nonprod:
    enabled: true
    chartVersion: "1.9.0"
  aks-commonground-prod:
    enabled: true
    chartVersion: "1.9.0"
