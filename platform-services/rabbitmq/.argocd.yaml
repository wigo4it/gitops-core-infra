# ArgoCD metadata for RabbitMQ Cluster Operator
# This file is discovered by the ApplicationSet to deploy RabbitMQ across clusters
# Using CloudPirates Helm chart: https://github.com/CloudPirates-io/helm-charts

chartName: rabbitmq-cluster-operator
chartRepoURL: oci://ghcr.io/cloudpirates-io/helm-charts
targetNamespace: rabbitmq-system

# Version control per cluster
clusters:
  # Local Development
  local-dev:
    enabled: true
    chartVersion: "0.1.5"  # Latest CloudPirates version
  
  # IKV Clusters
  aks-ikv-nonprod-vnext:
    enabled: true
    chartVersion: "0.1.5"
  aks-ikv-nonprod:
    enabled: true
    chartVersion: "0.1.5"
  aks-ikv-prod:
    enabled: true
    chartVersion: "0.1.5"
  
  # Commonground Clusters - TODO: Update cluster names when provided
  aks-commonground-nonprod:
    enabled: true
    chartVersion: "0.1.5"
  aks-commonground-prod:
    enabled: true
    chartVersion: "0.1.5"
