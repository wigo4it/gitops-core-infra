# RabbitMQ Operator - Local Development Cluster
# Minimal resource allocation for local testing (docker-desktop)

clusterOperator:
  # Single replica for dev
  replicaCount: 1
  
  # Reduced resources for local
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  
  # Disable PDB for local
  pdb:
    create: false
  
  # Minimal observability
  metrics:
    service:
      enabled: false

msgTopologyOperator:
  # Reduced resources
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
