# Base Helm values for RabbitMQ Cluster Operator
# Chart: cloudpirates/rabbitmq-cluster-operator
# Documentation: https://github.com/CloudPirates-io/helm-charts/tree/main/charts/rabbitmq-cluster-operator
# Default values: https://github.com/CloudPirates-io/helm-charts/blob/main/charts/rabbitmq-cluster-operator/values.yaml

# Cluster Operator Configuration
clusterOperator:
  # Resource limits for the operator
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  
  # Watch all namespaces
  watchAllNamespaces: true
  
  # Number of replicas
  replicaCount: 1
  
  # RBAC
  rbac:
    create: true
  
  # Service Account
  serviceAccount:
    create: true
  
  # Metrics
  metrics:
    service:
      enabled: false

# Messaging Topology Operator (manages RabbitMQ resources like Queues, Exchanges)
msgTopologyOperator:
  enabled: true
  
  resources: {}
  
  # RBAC
  rbac:
    create: true
  
  # Service Account
  serviceAccount:
    create: true


# Metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: false  # Enable if Prometheus Operator is available

# Additional labels
commonLabels:
  managed-by: argocd
  app.kubernetes.io/component: operator
