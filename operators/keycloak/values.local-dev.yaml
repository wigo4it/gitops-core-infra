# Keycloak Operator - Local Development Cluster
# Minimal resource allocation for local testing

# Reduced resources for local
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Disable leader election in single-node dev
leaderElection:
  enabled: false

# Enable metrics for local testing
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
