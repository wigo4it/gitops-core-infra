# Base Helm values for Keycloak Operator
# Chart: adfinis/keycloak-operator
# Documentation: https://artifacthub.io/packages/helm/adfinis/keycloak-operator

# Operator configuration
operator:
  enabled: true
  replicaCount: 1
  
  image:
    repository: quay.io/keycloak/keycloak-operator
    pullPolicy: IfNotPresent
    # tag: defaults to chart appVersion (26.5.0)
  
  # Resources for the operator pod
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # Service configuration
  service:
    enabled: true
    type: ClusterIP
    port: 8080
  
  # Service account
  serviceAccount:
    create: true
    annotations: {}

# Keycloak instance configuration
# Set enabled: false to only deploy the operator
keycloak:
  enabled: false  # We'll create Keycloak instances separately via CRDs
  
  # When enabled, configure the Keycloak instance here
  # instances: 1
  # db:
  #   vendor: postgres
  # hostname:
  #   hostname: keycloak.example.com
  # resources:
  #   requests:
  #     cpu: 100m
  #     memory: 256Mi
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
