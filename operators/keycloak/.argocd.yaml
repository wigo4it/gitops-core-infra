# ArgoCD metadata for Keycloak Operator
# This file is discovered by the ApplicationSet to deploy Keycloak across clusters
# Using official Keycloak operator: https://www.keycloak.org/operator/installation

# Use raw Kubernetes manifests instead of Helm
targetNamespace: keycloak-system

# Operator version (latest stable)
operatorVersion: "26.5.2"

# Cluster-specific enablement
clusters:
  # Local Development
  local-dev:
    enabled: true
  
  # IKV Clusters
  aks-ikv-nonprod-vnext:
    enabled: true
  aks-ikv-nonprod:
    enabled: true
  aks-ikv-prod:
    enabled: true
  
  # Commonground Clusters
  aks-commonground-nonprod:
    enabled: true
  aks-commonground-prod:
    enabled: true
