# Keycloak Custom Resource
# Official Keycloak Operator: https://www.keycloak.org/operator/installation
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak-system
  labels:
    app: keycloak
    managed-by: argocd
spec:
  # Number of Keycloak instances
  instances: 1
  
  # Image configuration (optional - uses operator default if not specified)
  # image: quay.io/keycloak/keycloak:26.5.2
  
  # Resource configuration
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # HTTP configuration
  http:
    httpEnabled: true  # Enable HTTP for local/non-prod
  
  # Hostname configuration
  hostname:
    strict: false  # Disable strict hostname checking for local dev
  
  # Database configuration - using embedded H2 for simplicity
  # For production, configure external PostgreSQL:
  # db:
  #   vendor: postgres
  #   host: postgres-service
  #   database: keycloak
  #   usernameSecret:
  #     name: keycloak-db-secret
  #     key: username
  #   passwordSecret:
  #     name: keycloak-db-secret
  #     key: password
  
  # Health probe configuration
  readinessProbe:
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    periodSeconds: 20
    failureThreshold: 5
  startupProbe:
    periodSeconds: 5
    failureThreshold: 60
  
  # Additional server options
  additionalOptions:
    - name: log-console-output
      value: json
    - name: metrics-enabled
      value: "true"
