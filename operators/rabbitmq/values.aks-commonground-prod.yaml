# Environment-specific overrides for RabbitMQ in Commonground prod
# Inherits from: operators/rabbitmq/values.yaml

additionalLabels:
  managed-by: argocd
  cluster: commonground
  environment: prod

# High availability
replicaCount: 2

# Production resources
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

clusterOperator:
  logLevel: warn
  watchNamespace: ""

# Anti-affinity for HA
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq-cluster-operator
          topologyKey: kubernetes.io/hostname
