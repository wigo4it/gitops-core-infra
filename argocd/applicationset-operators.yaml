apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-operators
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: '.'
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Matrix generator combining operator discovery with cluster list
    - matrix:
        generators:
          # Discover operators via .argocd.yaml files
          - git:
              repoURL: https://github.com/wigo4it/gitops-core-infra.git
              revision: HEAD
              files:
                - path: "operators/**/.argocd.yaml"
          
          # Only generate for registered clusters
          - clusters:
              selector:
                matchLabels: {}  # Match all registered clusters
  
  template:
    metadata:
      name: '{{.path.basename}}-{{.name}}'
      labels:
        operator: '{{.path.basename}}'
        cluster: '{{.name}}'
        environment: '{{if index .metadata.labels "environment"}}{{index .metadata.labels "environment"}}{{else}}unknown{{end}}'
        cluster-group: '{{if index .metadata.labels "cluster-group"}}{{index .metadata.labels "cluster-group"}}{{else}}unknown{{end}}'
        argocd.argoproj.io/application-set: platform-operators
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '.'
        operator-version: '{{index (index .clusters .name) "chartVersion"}}'
    
    spec:
      project: default
      
      # Multi-source configuration
      # Supports both Helm charts and raw Kubernetes manifests
      sources:
        # Source 1: Helm chart (if chartName is defined) OR manifests directory
        {{- if .chartName }}
        # Helm chart source
        - repoURL: '{{.chartRepoURL}}'
          chart: '{{.chartName}}'
          targetRevision: '{{index (index .clusters .name) "chartVersion"}}'
          helm:
            releaseName: '{{.path.basename}}'
            valueFiles:
              - $values/operators/{{.path.basename}}/values.yaml
              - $values/operators/{{.path.basename}}/values.{{.name}}.yaml
        {{- else }}
        # Raw Kubernetes manifests
        - repoURL: https://github.com/wigo4it/gitops-core-infra.git
          targetRevision: HEAD
          path: operators/{{.path.basename}}/manifests
        {{- end }}
        
        # Source 2: Values/config repository reference
        - repoURL: https://github.com/wigo4it/gitops-core-infra.git
          targetRevision: HEAD
          ref: values
      
      destination:
        name: '{{.name}}'
        namespace: '{{.targetNamespace}}'
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      
      # Ignore differences in status fields
      ignoreDifferences:
        - group: "*"
          kind: "*"
          jsonPointers:
            - /status
            - /metadata/resourceVersion
            - /metadata/generation
            - /metadata/managedFields
    
  # Sync wave for ordering
  syncPolicy:
    applicationsSync: create-update
