apiVersion: v1
kind: ConfigMap
metadata:
  name: aks-ikv-prod-config
  namespace: argocd
  labels:
    cluster: ikv
    environment: prod
    argocd.argoproj.io/secret-type: cluster
data:
  cluster.name: "aks-ikv-prod"
  cluster.group: "ikv"
  environment: "prod"
  # Define which components to deploy on this cluster
  components: |
    - redir-operator
    - rabbitmq-operator
    - keda-operator
