# Environment-specific overrides for Redir Operator in IKV nonprod-vnext
# Inherits from: helm-values/base/redir-operator.yaml

# Labels for this environment
labels:
  managed-by: argocd
  app.kubernetes.io/component: operator
  cluster: ikv
  environment: nonprod-vnext

# Operator config
operator:
  watchNamespace: ""
  logLevel: debug
  metrics:
    enabled: true
    port: 8080

# Resources - lower for nonprod
resources:
  limits:
    cpu: 150m
    memory: 192Mi
  requests:
    cpu: 50m
    memory: 96Mi
