---
# App-of-Apps root for IKV nonprod cluster
# This is the entry point - apply this to bootstrap the cluster

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ikv-nonprod-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/wigo4it/gitops-core-infra.git
    targetRevision: HEAD
    path: argocd
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
