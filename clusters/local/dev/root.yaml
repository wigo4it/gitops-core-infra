apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-dev-root
  namespace: argocd
  labels:
    cluster: local
    environment: dev
spec:
  project: default
  
  source:
    repoURL: https://github.com/wigo4it/gitops-core-infra.git
    targetRevision: HEAD
    path: argocd
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
